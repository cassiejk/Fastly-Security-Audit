name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to package, for example v24.2.2
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package Release Assets
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Verify Bash runtime
        run: |
          echo "bash path: $(command -v bash)"
          bash --version
          bash -c 'source ./lib/runtime.sh; ngwaf_require_bash_runtime github-actions'

      - name: Validate release scripts
        run: |
          bash -n fastly-audit ngwaf ngwaf-update install.sh scripts/package-release \
            tests/package-release.sh tests/install.sh tests/updater.sh
          shellcheck -S warning fastly-audit ngwaf ngwaf-update install.sh \
            scripts/package-release tests/package-release.sh tests/install.sh tests/updater.sh

      - name: Test package, installer, and updater
        run: |
          ./tests/package-release.sh
          ./tests/install.sh
          ./tests/updater.sh

      - name: Package release assets and verify tag
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          ./scripts/package-release --tag "$tag" --dist dist
          (cd dist && sha256sum -c fastly-audit.tar.gz.sha256)
          tar -tzf dist/fastly-audit.tar.gz >/dev/null

      - name: Create draft release with verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to replace its assets" >&2
            exit 1
          fi
          gh release create "$tag" \
            dist/fastly-audit.tar.gz \
            dist/fastly-audit.tar.gz.sha256 \
            dist/fastly-audit-installer.sh \
            --draft --verify-tag --title "$tag" --generate-notes
