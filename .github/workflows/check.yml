name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install ShellCheck on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install Bash and ShellCheck on macOS
        if: runner.os == 'macOS'
        run: |
          brew install bash shellcheck
          echo "$(brew --prefix)/bin" >> "$GITHUB_PATH"

      - name: Verify Bash runtime
        run: |
          echo "bash path: $(command -v bash)"
          bash --version
          if [[ "${RUNNER_OS}" == "macOS" ]]; then
            expected="$(brew --prefix)/bin/bash"
            actual="$(command -v bash)"
            [[ "$actual" == "$expected" ]]
          fi
          bash -c 'source ./lib/runtime.sh; ngwaf_require_bash_runtime github-actions'

      - name: Run checks
        run: ./scripts/check
